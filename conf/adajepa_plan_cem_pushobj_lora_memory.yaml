defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: eval_outputs/${replace_slash:${model_name}}/cem_cross_episode_lora_seed${seed}
  sweep:
    dir: eval_outputs/${replace_slash:${model_name}}/cem_cross_episode_lora_seed${seed}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 64
    gres: "gpu:1"
    qos: "normal"
    timeout_min: 720

ckpt_base_path: ./checkpoints
model_name: null
model_epoch: latest

seed: 100
n_evals: 50
goal_source: segments
eval_data_path: null
ood_corruption: null
ood_level: null
env_kwargs_override: null
goal_H: 25
n_plot_samples: 10
decode_for_viz: false
num_start_frames: 1
debug_dset_init: false

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: staged

planner:
  _target_: planning.cross_episode_lora.CrossEpisodeLoRAMPCPlanner
  max_iter: 20
  n_taken_actions: 5

  adapt:
    lr: 5e-4
    steps: 3
    optimizer: adam
    finetune_every: 1
    replay_buffer: recent5
    finetune_encoder: false
    last_layer_only: false

  memory:
    enabled: true
    rank: 16
    alpha: 32.0
    dropout: 0.0
    key_steps: 10
    validation_steps: 5
    capacity: 32
    min_similarity: 0.9
    store_min_norm: 0.0
    clear_on_plan_start: true

  reuse_actions: true
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 25
    topk: 30
    num_samples: 200
    var_scale: 1
    opt_steps: 10
    eval_every: -1
  name: cross_episode_lora_plan_cem_pushobj
